# 1. HTTP Server - Redirect everything to HTTPS
server {
    listen 80;
    server_name nanglucso.pro.vn www.nanglucso.pro.vn localhost;

    # Let's Encrypt webroot challenge support
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - SSL Configuration
server {
    listen 443 ssl;
    server_name nanglucso.pro.vn www.nanglucso.pro.vn;

    ssl_certificate /etc/letsencrypt/live/nanglucso.pro.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nanglucso.pro.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://backend-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # AI chatbot: one question may chain several model + tool rounds (backend allows ~2 min)
    location /api/v1/assistant/ {
        proxy_pass http://backend-api:8080/api/v1/assistant/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    # SignalR WebSocket support
    location /hubs/ {
        proxy_pass http://backend-api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Health endpoint
    location /health {
        proxy_pass http://backend-api:8080/health;
        proxy_set_header Host $host;
    }

    # MinIO Object Storage (presigned URLs rewritten under /storage via FileStorage:MinioPublicEndpoint)
    location /storage/ {
        rewrite ^/storage/(.*) /$1 break;
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 550M;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;
    }

    # Upload size limit (fallback proxy uploads and proctoring chunks)
    client_max_body_size 550M;
}
