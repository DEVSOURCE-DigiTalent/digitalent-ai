<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="hex-title">
  <title id="hex-title">DigiTalent AI Hexagonal Competency Core</title>
  <defs>
    <!-- Facet Gradients for 3D Isometric Depth -->
    <linearGradient id="f-top-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="f-top-right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="f-right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="f-bottom-right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="f-bottom-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="f-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <!-- Core Glow -->
    <radialGradient id="hex-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="80%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#312E81"/>
    </radialGradient>
    <!-- Pulse Spark -->
    <radialGradient id="hex-spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </radialGradient>
  </defs>

  <!-- 6 Modular Facets (Separated with 1.5px gaps) -->
  <!-- Top Left Facet (Domain 1) -->
  <polygon points="32,7 13.5,17.7 20,24 32,20" fill="url(#f-top-left)"/>
  <!-- Top Right Facet (Domain 2) -->
  <polygon points="32,7 50.5,17.7 44,24 32,20" fill="url(#f-top-right)"/>
  <!-- Right Facet (Domain 3) -->
  <polygon points="50.5,17.7 50.5,39.3 43,36 43,26" fill="url(#f-right)"/>
  <!-- Bottom Right Facet (Domain 4) -->
  <polygon points="50.5,39.3 32,50 32,41 42,37" fill="url(#f-bottom-right)"/>
  <!-- Bottom Left Facet (Domain 5) -->
  <polygon points="32,50 13.5,39.3 22,37 32,41" fill="url(#f-bottom-left)"/>
  <!-- Left Facet (Domain 6) -->
  <polygon points="13.5,39.3 13.5,17.7 21,26 21,36" fill="url(#f-left)"/>

  <!-- Connecting Circuit Ribs -->
  <line x1="32" y1="20" x2="32" y2="26" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="43" y1="26" x2="38" y2="29" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="42" y1="37" x2="37" y2="34" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="32" y1="41" x2="32" y2="36" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="22" y1="37" x2="27" y2="34" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="21" y1="26" x2="26" y2="29" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Central Intelligence AI Core -->
  <circle cx="32" cy="31" r="8" fill="url(#hex-core-glow)"/>
  <circle cx="32" cy="31" r="8.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1"/>

  <!-- Talent Pulse Spark on Apex -->
  <circle cx="51" cy="17" r="3.2" fill="url(#hex-spark)"/>
  <circle cx="51" cy="17" r="1.1" fill="#FFFFFF"/>
</svg>
