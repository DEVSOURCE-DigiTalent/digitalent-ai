<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="seal-title">
  <title id="seal-title">DigiTalent AI Certified Competency Seal</title>
  <defs>
    <!-- Gold Foil Gradients -->
    <linearGradient id="gold-rim" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FEF3C7"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="seal-navy" x1="40" y1="20" x2="120" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="core-cyan" x1="60" y1="60" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Circular Text Path -->
    <path id="text-path-top" d="M 28 80 A 52 52 0 1 1 132 80" fill="none"/>
    <path id="text-path-bottom" d="M 132 80 A 52 52 0 0 1 28 80" fill="none"/>
  </defs>

  <!-- Outer Starburst / Notched Border -->
  <circle cx="80" cy="80" r="77" fill="none" stroke="url(#gold-rim)" stroke-width="2.5" stroke-dasharray="3,2"/>
  <circle cx="80" cy="80" r="73" fill="none" stroke="url(#gold-rim)" stroke-width="1.2"/>
  <circle cx="80" cy="80" r="69" fill="url(#seal-navy)"/>

  <!-- Engraved Circular Text Ring -->
  <circle cx="80" cy="80" r="68" fill="none" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="0.8"/>
  <circle cx="80" cy="80" r="53" fill="none" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="0.8"/>

  <!-- Curved Text: Top Arc -->
  <text font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="800" fill="#FDE68A" letter-spacing="0.18em">
    <textPath href="#text-path-top" startOffset="50%" text-anchor="middle">
      DIGITALENT AI · ACCREDITATION
    </textPath>
  </text>

  <!-- Curved Text: Bottom Arc -->
  <text font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#FCD34D" letter-spacing="0.15em">
    <textPath href="#text-path-bottom" startOffset="50%" text-anchor="middle">
      ★ CIRCULAR 02 / DIGCOMP ★
    </textPath>
  </text>

  <!-- Inner Medallion Background -->
  <circle cx="80" cy="80" r="51" fill="#090D1A"/>
  <circle cx="80" cy="80" r="50" fill="none" stroke="url(#gold-rim)" stroke-width="1.5"/>

  <!-- Six Competency Domains Hexagon Geometry -->
  <!-- Outer Hexagon Skeleton -->
  <polygon points="80,42 108,58 108,90 80,106 52,90 52,58" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.5"/>
  <!-- Connecting Neural Spokes to Center -->
  <line x1="80" y1="42" x2="80" y2="80" stroke="#818CF8" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="108" y1="58" x2="80" y2="80" stroke="#818CF8" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="108" y1="90" x2="80" y2="80" stroke="#818CF8" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="80" y1="106" x2="80" y2="80" stroke="#818CF8" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="52" y1="90" x2="80" y2="80" stroke="#818CF8" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="52" y1="58" x2="80" y2="80" stroke="#818CF8" stroke-width="0.8" stroke-opacity="0.6"/>

  <!-- 6 Competency Domain Nodes -->
  <circle cx="80" cy="42" r="2.8" fill="#F59E0B"/>
  <circle cx="108" cy="58" r="2.8" fill="#38BDF8"/>
  <circle cx="108" cy="90" r="2.8" fill="#34D399"/>
  <circle cx="80" cy="106" r="2.8" fill="#F43F5E"/>
  <circle cx="52" cy="90" r="2.8" fill="#A855F7"/>
  <circle cx="52" cy="58" r="2.8" fill="#38BDF8"/>

  <!-- Central Glowing AI Crest -->
  <circle cx="80" cy="80" r="14" fill="url(#core-cyan)"/>
  <circle cx="80" cy="80" r="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1"/>
  <text x="80" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.05em">
    AI
  </text>

  <!-- Left & Right Laurel Leaf Sprigs at bottom -->
  <g fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round" opacity="0.8">
    <path d="M 64 122 Q 80 126 96 122"/>
    <circle cx="80" cy="124" r="1.5" fill="#FCD34D"/>
    <circle cx="73" cy="123" r="1.2" fill="#FCD34D"/>
    <circle cx="87" cy="123" r="1.2" fill="#FCD34D"/>
  </g>
</svg>
