name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docker/**'
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: digitalent
          POSTGRES_USER: digitalent_app
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Verify test count
        run: |
          TEST_COUNT=$(dotnet test --no-build --configuration Release --verbosity quiet --logger "console;verbosity=minimal" 2>&1 | grep -oP 'Total tests: \K[0-9]+' || echo "0")
          echo "Test count: $TEST_COUNT"
          if [ "$TEST_COUNT" -eq "0" ]; then
            echo "::error::No tests found! Backend must have real tests."
            exit 1
          fi
