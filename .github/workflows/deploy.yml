name: Deploy to VPS (Develop)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-develop
  cancel-in-progress: false

jobs:
  backend-ci:
    name: Backend CI
    uses: ./.github/workflows/backend-ci.yml

  frontend-ci:
    name: Frontend CI
    uses: ./.github/workflows/frontend-ci.yml

  deploy:
    name: Deploy to VPS Server
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.VPS_USER || secrets.EC2_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.EC2_SSH_KEY }}
          timeout: 15m
          command_timeout: 15m
          script: |
            bash /opt/digitalent-ai/scripts/deploy-develop.sh
